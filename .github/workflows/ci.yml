name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: app tests (serving dependencies only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run python manage.py check
      - run: uv run pytest -q

  model:
    name: NumPy inference matches PyTorch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv run --no-sync pytest -q tests/test_infer.py
